name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Núcleo (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas de LectoraCore
        run: swift test --package-path Packages/LectoraCore
      - name: Pruebas de LectoraCore en hora de México (fechas que no dependen de UTC)
        run: TZ=America/Mexico_City swift test --package-path Packages/LectoraCore
      - name: Sistema de diseño (sin valores sueltos en pantallas)
        run: ./scripts/lint-design.sh
      - name: Sistema base de la casa (botones que dicen qué hacen, espacios, letra y toque mínimos)
        run: python3 tools/sistema-base/revisar.py

  app:
    name: App (iPhone y Mac)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # La app usa lo de iOS 26 (vidrio, marcas en la barra): el Xcode de fábrica
      # del runner (16.4) no lo conoce y la compilación fallaba desde el 23 nov.
      - name: Usar el Xcode más reciente
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Descargar foliate-js
        run: ./scripts/fetch-foliate.sh
      - name: Generar proyecto
        run: xcodegen generate
      - name: Compilar para iPhone (simulador)
        run: >
          xcodebuild -project Lectora.xcodeproj -scheme Lectora_iOS
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug build CODE_SIGNING_ALLOWED=NO
      - name: Compilar para Mac
        run: >
          xcodebuild -project Lectora.xcodeproj -scheme Lectora_macOS
          -destination 'generic/platform=macOS'
          -configuration Debug build CODE_SIGNING_ALLOWED=NO
