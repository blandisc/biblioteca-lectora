# Proyecto de Xcode generado con XcodeGen: `xcodegen generate` (ver README).
name: Lectora
options:
  bundleIdPrefix: mx.iracheta
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  # La app está en español: fechas, números y textos del sistema también.
  developmentLanguage: es

packages:
  LectoraCore:
    path: Packages/LectoraCore

targets:
  Lectora:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: App/Shared
      - path: App/Resources/Reader
        type: folder
        buildPhase: resources
      # Cinzel (OFL): mayúsculas romanas de la marca y los rótulos.
      - path: App/Resources/Fonts
        buildPhase: resources
      # Ícono: verde fichero, tinta (modo oscuro) y tintado; y los tamaños del Mac.
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: LectoraCore
    info:
      path: App/Generated/Info-${platform}.plist
      properties:
        CFBundleDisplayName: Gabinete
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
        LSApplicationCategoryType: public.app-category.books
        UILaunchScreen: {}
        UIAppFonts:
          - Cinzel.ttf
        ATSApplicationFontsPath: "."
        # La carpeta «Gabinete» se ve en Archivos › En mi iPhone › Gabinete.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Gabinete
        PRODUCT_BUNDLE_IDENTIFIER: mx.iracheta.gabinete
        # Equipo de Fernando (el mismo que Orbital): firma para instalar en su iPhone.
        DEVELOPMENT_TEAM: B7KRCF776Z
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: App/Entitlements/Lectora-${platform}.entitlements
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
